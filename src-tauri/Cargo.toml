[package]
name = "harness_test_portal_app"
description = "Harness Test Portal: the app shell that shows the quiz frontend in a native window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "harness_test_portal_app_lib"
path = "src/lib.rs"

[[bin]]
name = "harness-test-portal"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
# `generate_context!` embeds the `plugins` section of `tauri.conf.json` as `serde_json` values.
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
base64.workspace = true
minisign-verify.workspace = true
time.workspace = true
# `log` feature: the events reach tauri-plugin-log (no tracing subscriber is installed).
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
# The mock runtime: tests invoke the registered commands through the real IPC handler.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
